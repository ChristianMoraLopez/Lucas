<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entra a Luks</title>
  </head>
  <!-- Colores de lucas-design-kit/styles/tokens.css (tema Día). Estilos en línea: los clientes de correo no leen CSS externo. -->
  <body style="margin:0;padding:0;background:#FFFBF6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFFBF6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
            <tr>
              <td style="padding:0 4px 20px;font-family:'Bricolage Grotesque',Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#1C1433;">
                <span style="display:inline-block;width:14px;height:10px;border-radius:3px;background:#6A35E6;transform:rotate(-14deg);"></span><span style="display:inline-block;width:14px;height:10px;border-radius:3px;background:#0A7A4C;margin-left:-6px;margin-right:8px;"></span>lucas
              </td>
            </tr>
            <tr>
              <td style="background:#FFFFFF;border:1px solid #E6DEEE;border-radius:22px;padding:28px 24px;font-family:Figtree,Helvetica,Arial,sans-serif;color:#1C1433;">
                <h1 style="margin:0 0 8px;font-family:'Bricolage Grotesque',Helvetica,Arial,sans-serif;font-size:28px;line-height:30px;font-weight:800;letter-spacing:-0.6px;">Entra a Luks</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#625A78;">Es tu primera vez: toca el botón para confirmar el correo y entrar. Vence en una hora.</p>
                <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}"
                   style="display:block;text-align:center;background:#0A7A4C;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:16px;line-height:48px;border-radius:16px;box-shadow:0 4px 0 #064B2F;">Entrar a Luks</a>
                <p style="margin:24px 0 0;font-size:14px;line-height:20px;color:#625A78;">¿No te registraste en Luks? Ignora este correo y no pasa nada.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 4px 0;font-family:Figtree,Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;color:#625A78;">
                Luks · las cuentas compartidas de tu grupo de WhatsApp
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
