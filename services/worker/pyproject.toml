[project]
name = "lucas-worker"
version = "0.4.0"
description = "Lucas: convierte fotos de recibos, PDFs y mensajes en gastos clasificados (OCR, QR DIAN, Ollama y Laya)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Propietario" }
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  # PDF digital: texto con pdfplumber; páginas a imagen con pypdfium2 (viene con pdfplumber)
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  # QR de la factura electrónica DIAN
  "zxing-cpp>=3.0",
  # Fotos: preprocesamiento y OCR, todo en CPU (ruedas para linux/aarch64)
  "opencv-python-headless>=4.10",
  "rapidocr>=3.4",
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "pillow>=10.4",
  # Duplicados y memoria de comercios
  "imagehash>=4.3",
  "rapidfuzz>=3.10",
  # Laya sobre ONNX Runtime, sin PyTorch en el servidor
  "tokenizers>=0.20",
  "huggingface-hub>=0.26",
  "sentry-sdk>=2.18,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "respx>=0.21",
  "ruff>=0.8",
  "onnx>=1.17",   # arma un modelo ONNX diminuto para probar el runner de Laya
  "fpdf2>=2.8",   # solo para regenerar los recibos de ejemplo (scripts/make_fixtures.py)
]

[project.scripts]
lucas-worker = "lucas_worker.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucas_worker"]

[tool.uv]
# rapidocr pide opencv-python (con GUI, necesita libGL). En el servidor basta la
# versión headless, que trae el mismo módulo cv2: se descarta la otra.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "laya_real: compara con el paquete oficial `laya` (necesita torch; se salta si no está)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# El notebook lo genera scripts/build_notebook.py, que revisa que cada celda compile
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", # comillas «» y letras con tilde en textos en español
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"lucas_worker/classify/laya_format.py" = ["E501", "UP", "SIM", "B", "RUF"] # copiado de laya tal cual
"tests/*" = ["E501"]
"scripts/build_notebook.py" = ["E501"] # el contenido del notebook va tal cual
