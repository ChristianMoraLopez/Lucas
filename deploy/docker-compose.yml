# ============================================================================
# Luks en un servidor (Oracle Cloud Always Free, Ampere A1 arm64, sin GPU)
#
#   connector    WhatsApp (Baileys): grupos enlazados → mensajes → cola
#   worker       la cola: OCR, QR DIAN, Qwen 2.5 (Ollama) y Laya → gastos
#   ollama       el LLM local (+ ollama-pull, que baja el modelo una vez)
#   uptime-kuma  avisa si algo se cae (solo en 127.0.0.1:3001: se entra por SSH)
#
#   cd deploy
#   ./configurar.sh               # los .env de connector y worker, con tus secretos
#   docker compose up -d --build
#   docker compose exec connector node dist/cli.js vincular-contador
#
# Paso a paso: deploy/README.md
# ============================================================================

name: luks

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # CPU: uno a la vez rinde más
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Sin puertos publicados: solo el worker lo usa, por la red interna

  # Baja el modelo de OLLAMA_MODEL (services/worker/.env) y sale
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    env_file: ../services/worker/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull \"$${OLLAMA_MODEL:-qwen2.5:7b}\""]
    restart: "no"

  worker:
    build: ../services/worker
    image: luks-worker:latest
    restart: unless-stopped
    env_file: ../services/worker/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      - models:/models   # Laya bajado de Hugging Face; sobrevive a reconstruir la imagen
    stop_grace_period: 5m  # termina el recibo que esté leyendo antes de apagarse
    deploy:
      resources:
        limits:
          memory: 6g

  connector:
    build:
      context: ..
      dockerfile: services/connector/Dockerfile
    image: luks-connector:latest
    restart: unless-stopped
    env_file: ../services/connector/.env
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    # /health, /health/cola y /health/vivo en el puerto 8080, solo para Uptime Kuma

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"   # nunca abierto a internet: ssh -L 3001:localhost:3001 …

volumes:
  ollama:
    name: luks-ollama
  models:
    name: luks-models
  kuma:
    name: luks-kuma
