packages:
  - "apps/*"
  - "services/*"
  - "supabase"
# Scripts de instalación permitidos (pnpm 12 falla en CI si alguno queda sin decidir)
allowBuilds:
  esbuild: true
  # Dependencia de Serwist: sus binarios llegan por dependencias opcionales, no necesita script
  "@swc/core": false
  # Connector: el de Baileys solo revisa la versión de Node; el de protobufjs prepara su CLI
  baileys: false
  protobufjs: false
